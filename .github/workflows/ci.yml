# Runs every check on each pull request and on each push to main.
# The same commands work locally: see "Checks" in the README.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 or newer: the store uses Node's built-in node:sqlite.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says.
      - run: npm ci

      - name: Formatting (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, every project)
        run: npm run lint

      - name: Typecheck (every project)
        run: npm run typecheck

      # Unit tests (Vitest: libs, ingest gate, web components) and the API's
      # integration tests (Jest: the whole Nest app over real HTTP on a temp
      # SQLite file). No network or API key needed.
      - name: Unit and integration tests
        run: npm test

      - name: Build (every project)
        run: npm run build
